name: Validate shared React Native code
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-code:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Upload web and Electron bundles (not native applications)
        uses: actions/upload-artifact@v4
        with:
          name: shared-bundles-${{ matrix.os }}
          path: |
            build/web/
            build/electron/
