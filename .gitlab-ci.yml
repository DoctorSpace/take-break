image: node:24-bookworm

stages:
  - verify
  - package
  - release

shared-code:
  stage: verify
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --ignore-scripts --cache .npm --prefer-offline
    - npm test
    - npm run build
  artifacts:
    name: shared-react-native-bundles
    paths:
      - build/web/
      - build/electron/
    expire_in: 7 days

package-linux:
  stage: package
  needs:
    - job: shared-code
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - npm ci --ignore-scripts --cache .npm --prefer-offline
    - VERSION="${CI_COMMIT_TAG#v}"
    - npm run package:linux -- --x64 -c.extraMetadata.version="$VERSION"
  artifacts:
    name: linux-x64-$CI_COMMIT_TAG
    paths:
      - release/*.AppImage
      - release/*.tar.gz
    expire_in: 7 days

publish-release:
  stage: release
  needs:
    - job: package-linux
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  resource_group: release-$CI_COMMIT_TAG
  script:
    - node scripts/publish-release.mjs
